# Déploiement continu sur Azure Container Apps.
# À chaque push sur `main` : construit l'image Docker, l'envoie dans
# Azure Container Registry, puis met à jour la Container App.
# Configuration (secret + variables GitHub) : voir DEPLOY-AZURE.md, étape 7.
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    # Ne tourne que lorsque les variables Azure ont été configurées sur GitHub
    if: ${{ vars.ACR_NAME != '' }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/vibe-workout-tracker:${{ github.sha }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Connexion au Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Construire et envoyer l'image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Déployer la nouvelle image
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image "$IMAGE"
