# Déploiement continu sur Azure Container Apps.
# À chaque push sur `main` : construit l'image Docker, l'envoie dans
# GitHub Container Registry (ghcr.io, gratuit), puis met à jour la Container App.
# Configuration (secret + variables GitHub) : voir DEPLOY-AZURE.md, étape 7.
name: Deploy to Azure

on:
  push:
    branches: [main]
    # Pas de redéploiement pour un commit qui ne touche que la doc ou la maintenance
    paths-ignore:
      - '**.md'
      - 'scripts/azure-free-check.sh'
      - '.github/workflows/azure-free-setup.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write # publier l'image sur ghcr.io avec le GITHUB_TOKEN

jobs:
  build-and-deploy:
    # Ne tourne que lorsque les variables Azure ont été configurées sur GitHub
    if: ${{ vars.CONTAINER_APP_NAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Nom de l'image
        # ghcr.io exige un nom en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Connexion à GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construire et envoyer l'image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Connexion à Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Déployer la nouvelle image
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image "$IMAGE"
