# Maintenance ponctuelle : passe l'infrastructure Azure en 100 % gratuit.
# Se lance une fois, au push de ce fichier, avec l'identité Azure de GitHub
# (droits limités au groupe de ressources). Le compte rendu est publié sur la
# branche `azure-reports`.
name: Azure free setup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/azure-free-setup.yml']

permissions:
  contents: write # publier le compte rendu sur la branche azure-reports

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      RG: ${{ vars.RESOURCE_GROUP }}
      APP: ${{ vars.CONTAINER_APP_NAME }}
      ACR: acrvibeworkout26495
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Passer en gratuit et vérifier
        run: |
          az extension add --name containerapp --upgrade --only-show-errors 2>/dev/null
          set +e +o pipefail
          exec > >(tee report.txt) 2>&1
          trap 'sleep 2' EXIT
          step() { echo; echo "##### $*"; }

          step "1. Image utilisée par l'appli"
          IMAGE=$(az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].image" -o tsv)
          echo "$IMAGE"
          case "$IMAGE" in
            ghcr.io/*) echo "OK : l'appli tourne sur GitHub Container Registry" ;;
            *) echo "ARRÊT : l'appli n'utilise pas ghcr.io, le registre Azure n'est pas supprimé"; exit 1 ;;
          esac

          step "2. Retrait du registre Azure de la configuration de l'appli"
          if az containerapp registry list -n "$APP" -g "$RG" --query "[].server" -o tsv | grep -qi "$ACR.azurecr.io"; then
            az containerapp registry remove -n "$APP" -g "$RG" --server "$ACR.azurecr.io" -o none && echo "OK : retiré"
          else
            echo "OK : déjà retiré"
          fi

          step "3. Suppression du registre Azure (payant)"
          if az acr show -n "$ACR" -g "$RG" -o none 2>/dev/null; then
            az acr delete -n "$ACR" -g "$RG" --yes && echo "OK : supprimé"
          else
            echo "OK : déjà supprimé"
          fi

          step "4. Taille de l'appli : 0,25 vCPU / 0,5 Go, 0 à 1 instance"
          az containerapp update -n "$APP" -g "$RG" --cpu 0.25 --memory 0.5Gi --min-replicas 0 --max-replicas 1 \
            --query "properties.template.{cpu:containers[0].resources.cpu, memoire:containers[0].resources.memory, min:scale.minReplicas, max:scale.maxReplicas}" -o table

          step "5. Plafond des logs : 0,1 Go par jour"
          WS=$(az monitor log-analytics workspace list -g "$RG" --query "[0].name" -o tsv)
          az monitor log-analytics workspace update -g "$RG" -n "$WS" --quota 0.1 \
            --query "{espace:name, plafondGoParJour:workspaceCapping.dailyQuotaGb, conservationJours:retentionInDays}" -o table

          step "6. Alerte de budget (1, alerte au premier centime, envoyée au propriétaire de l'abonnement)"
          SUB=$(az account show --query id -o tsv)
          cat > budget.json <<JSON
          {"properties": {"category": "Cost", "amount": 1, "timeGrain": "Monthly",
            "timePeriod": {"startDate": "$(date -u +%Y-%m-01)T00:00:00Z"},
            "notifications": {
              "premier-centime": {"enabled": true, "operator": "GreaterThan", "threshold": 1,
                "thresholdType": "Actual", "contactEmails": [], "contactRoles": ["Owner"]}}}}
          JSON
          az rest --method put \
            --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Consumption/budgets/budget-vibe-workout?api-version=2023-05-01" \
            --body @budget.json --query "{budget:name, montant:properties.amount, periode:properties.timeGrain}" -o table \
            || echo "ÉCHEC : budget non créé (voir le message ci-dessus)"

          step "7. L'appli répond-elle ?"
          FQDN=$(az containerapp show -n "$APP" -g "$RG" --query "properties.configuration.ingress.fqdn" -o tsv)
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://$FQDN/login" || true)
            echo "essai $i : HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          az containerapp revision list -n "$APP" -g "$RG" \
            --query "[?properties.active].{revision:name, sante:properties.healthState, etat:properties.runningState}" -o table

          step "8. Vérification de gratuité"
          bash scripts/azure-free-check.sh

      - name: Publier le compte rendu
        if: always()
        run: |
          [ -f report.txt ] || echo "Pas de compte rendu (échec avant le début)" > report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan azure-reports
          git rm -rq --cached .
          git add report.txt
          git commit -qm "Compte rendu Azure free setup"
          git push -f origin HEAD:azure-reports
